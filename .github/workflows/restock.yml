name: Restock check

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Runs can be delayed during busy periods.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test notification"
        type: boolean
        default: false

permissions:
  contents: write   # lets the job save state.json back to the repo

# Never run two checks at once (avoids state conflicts).
concurrency:
  group: restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python3 restock_check.py --test
          else
            python3 restock_check.py
          fi

      - name: Save state if it changed
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update stock state"
            git push
          fi
